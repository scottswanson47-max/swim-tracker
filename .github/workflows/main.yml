name: Hourly Swim Scrape
on:
  schedule:
    - cron: '0 * * * *' 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    # This explicitly gives the robot permission to "write" the file
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Updated to v4

      - name: Set up Python
        uses: actions/setup-python@v5 # Updated to v5
        with:
          python-version: '3.9'

      - name: Install Chrome and Scraper tools
        run: |
          pip install selenium webdriver-manager

      - name: Run Scraper
        run: python scraper.py

      - name: Save and Upload results
        run: |
          git config user.name "Automated"
          git config user.email "actions@users.noreply.github.com"
          git add swim_data.json
          # This line prevents the error if nothing has changed
          git commit -m "Update swim slots" || echo "No changes to commit"
          git push
